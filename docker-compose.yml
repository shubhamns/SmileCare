# Public
# Patient
# Admin
# Docker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smilecare
      POSTGRES_PASSWORD: smilecare
      POSTGRES_DB: smilecare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smilecare -d smilecare"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://smilecare:smilecare@postgres:5432/smilecare
      REDIS_URL: redis://redis:6379
      PORT: 4000
      DISABLE_BULLMQ: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smilecare.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-http://localhost:4000/graphql}
        VITE_PATIENT_ROUTE: ${VITE_PATIENT_ROUTE:-/patient}
        VITE_DOCTOR_ROUTE: ${VITE_DOCTOR_ROUTE:-/doctor}
        VITE_ADMIN_ROUTE: ${VITE_ADMIN_ROUTE:-/admin}
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  redis_data:
